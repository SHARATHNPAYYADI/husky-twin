# Render Blueprint — https://render.com/docs/infrastructure-as-code
#
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo.
# Render finds this file automatically (must be at repo root).
#
# After the first deploy, set FRONTEND_ORIGINS in the Render dashboard
# (Environment tab) to your Vercel URL, e.g.:
#   https://husky-twin.vercel.app
# Comma-separate multiple origins if needed. localhost:5173 always works
# regardless — see backend/app/main.py.
#
# Run history is stored in SQLite at backend/app/data/runs.db (see
# backend/app/db.py). Render's free web service filesystem is ephemeral, so
# this resets on every deploy/restart. If run history needs to survive
# restarts, add a paid persistent disk (`disks:` on this service, mounted
# at e.g. /var/data, with HUSKY_DB_PATH set to a path under it) or point
# HUSKY_DB_PATH-equivalent logic at an external Postgres instead.

services:
  - type: web
    name: husky-twin-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FRONTEND_ORIGINS
        value: ""